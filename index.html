<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light mode — the emerald brand color -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#10b981"
    />

    <!-- Dark mode — a deeper emerald that reads well against dark chrome -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#065f46"
    />

    <!-- SEO -->
    <title>SelfDev — Track the skills and habits that actually stick</title>
    <meta
      name="description"
      content="SelfDev is a calm, focused tracker for the skills and habits that matter to you. Log practice sessions, build daily habits, and watch your progress compound."
    />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SelfDev" />
    <meta
      property="og:description"
      content="Track the skills and habits that actually stick."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://selfdev-steel.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SelfDev" />
    <meta
      name="twitter:description"
      content="Track the skills and habits that actually stick."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
